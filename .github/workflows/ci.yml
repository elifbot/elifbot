name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sır taraması
        run: python3 bot/tools/sir_tara.py .
      - name: Kural testleri (v8)
        run: python -m pytest bot/tests -q
      - name: Kural tablosu
        run: python -m bot.v8.cli kurallar
      - name: 6-bot paketi import duman testi
        run: |
          cd bot/acarbot_6bot
          PYTHONPATH=motorlar:. python3 -c "import canli_6bot; print('6bot import OK')"
      - name: v9 smoke (5 dk)
        run: python3 -m bot.v9.cli paper --dakika 5 --sembol 20 --etiket ci_v9
      - name: Konsey boru hattı (ağsız kuru koşu)
        run: python3 -m kadro.konsey.calistir --kuru-kosu --etiket ci_kuru
      - name: Kısa replay (2 dk piyasa zamanı)
        run: python3 bot/tools/replay_6bot.py --dakika 2 --etiket ci --sembol 120
