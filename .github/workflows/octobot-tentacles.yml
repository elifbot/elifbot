name: OctoBot OKX paper hazırlık tanısı
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tentacles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OctoBot 2.1.1 kur
        run: python -m pip install 'octobot[full]==2.1.1'
      - name: Resmi tentacle ve profil kurulumunu dene
        run: |
          mkdir -p runs/octobot_setup
          cd runs/octobot_setup
          set +e
          timeout 300 OctoBot tentacles --install --all > tentacles.log 2>&1
          code=$?
          tail -100 tentacles.log
          CODE="$code" python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('tentacles.log')
          lines=p.read_text(errors='replace').splitlines() if p.exists() else []
          result={'stage':'tentacle_install_only','exit_code':int(os.environ['CODE']),
                  'note':'No OctoBot paper trading was run', 'log_tail':'\n'.join(lines[-15:])[-2000:]}
          Path('report.json').write_text(json.dumps(result,indent=2))
          print('::notice title=OctoBot kurulum tanısı::'+json.dumps(result))
          PY
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octobot-tentacle-tani
          path: runs/octobot_setup/
          if-no-files-found: warn
          retention-days: 7
