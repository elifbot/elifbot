name: Konsey

# Çoklu model konseyi: havuzu tarar, 3 tur tartışır, karar + yama üretir.
# Sağlayıcılar: github (GITHUB_TOKEN, models: read) ve nvidia (NVIDIA_API_KEY secret).
on:
  workflow_dispatch:
    inputs:
      gorev:
        description: "Konseye verilecek görev"
        required: false
        default: "Botun ölçülebilir kenarını artır: en yüksek etkili 5 değişiklik."
      saglayici:
        description: "Sağlayıcılar (virgülle): github,nvidia"
        required: false
        default: "github,nvidia"
      butce:
        description: "Azami model çağrısı"
        required: false
        default: "20"
      teshis:
        description: "1 = model sondası (çalışan modeli bulur, konsey kurmaz)"
        required: false
        default: "0"
      teshis_model:
        description: "Sondayı bu model(ler)e sınırla (virgülle)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  models: read          # GitHub Models için — ayrı anahtar gerekmez

concurrency:
  group: konsey
  cancel-in-progress: false

jobs:
  konsey:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sır taraması (kapı)
        run: python3 bot/tools/sir_tara.py .

      - name: Havuzu indeksle ve demetleri üret
        run: |
          python3 -m havuz.indeks
          python3 -m havuz.digest

      - name: Konsey oturumu
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ vars.NVIDIA_API_KEY || secrets.NVIDIA_API_KEY }}
          GOREV: ${{ github.event.inputs.gorev }}
          SAGLAYICILAR: ${{ github.event.inputs.saglayici }}
          BUTCE: ${{ github.event.inputs.butce }}
          TESHIS: ${{ github.event.inputs.teshis }}
          TESHIS_MODEL: ${{ github.event.inputs.teshis_model }}
          ACARBOT_MODEL: ${{ vars.ACARBOT_MODEL }}
          ACARBOT_ZAMAN_ASIMI: "300"
          ACARBOT_SURE: "3000"
        run: |
          ETIKET="$(date -u +%Y%m%d-%H%M%S)"
          [ -n "$NVIDIA_API_KEY" ] && echo "::add-mask::$NVIDIA_API_KEY"
          ARGS=()
          IFS=',' read -ra LISTE <<< "$SAGLAYICILAR"
          for s in "${LISTE[@]}"; do ARGS+=(--saglayici "$(echo "$s" | tr -d ' ')"); done
          if [ "$TESHIS" = "1" ]; then
            TARGS=()
            IFS=',' read -ra MLIST <<< "$TESHIS_MODEL"
            for m in "${MLIST[@]}"; do [ -n "$m" ] && TARGS+=(--teshis-model "$m"); done
            ACARBOT_ZAMAN_ASIMI=300 python3 -m kadro.konsey.calistir --teshis \
              "${ARGS[@]}" "${TARGS[@]}" --etiket "$ETIKET"
          else
            python3 -m kadro.konsey.calistir \
              --gorev "$GOREV" "${ARGS[@]}" --butce "$BUTCE" --tur 3 --etiket "$ETIKET"
          fi
          echo "ETIKET=$ETIKET" >> "$GITHUB_ENV"

      - name: Çıktıyı yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: konsey-${{ env.ETIKET }}
          path: |
            konsey/
            havuz/digest/
          retention-days: 30

      - name: Sonucu PR olarak aç
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "konsey-bot"
          git config user.email "konsey@users.noreply.github.com"
          git checkout -b "konsey/${ETIKET}"
          git add konsey havuz/digest
          git commit -m "konsey: ${ETIKET} — çoklu model tartışması sonucu" || echo "değişiklik yok"
          git push -u origin "konsey/${ETIKET}"
          # GitHub Actions'tan PR açmak repo ayarına bağlı (Settings → Actions →
          # "Allow GitHub Actions to create and approve pull requests"). Kapalıysa
          # dal yine de itilir; sonucu insan/oturum PR'a çevirebilir.
          if ! gh pr create --base main --head "konsey/${ETIKET}" \
               --title "Konsey kararı ${ETIKET}" \
               --body-file "konsey/${ETIKET}/karar.md" > /tmp/pr.log 2>&1; then
            echo "PR açılamadı: $(tail -2 /tmp/pr.log)" | tee "konsey/${ETIKET}/pr-hatasi.txt"
            git add "konsey/${ETIKET}/pr-hatasi.txt"
            git commit --amend --no-edit -q
            git push -f -q origin "konsey/${ETIKET}"
          fi

      - name: Özet
        if: always()
        run: |
          if [ -f "konsey/${ETIKET}/karar.md" ]; then
            cat "konsey/${ETIKET}/karar.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "karar.md üretilemedi — oturum.json içindeki hata kayıtlarına bak" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json,glob,os
          for f in glob.glob("konsey/*/oturum.json"):
              d=json.load(open(f))
              h=[c for c in d.get("cagri",[]) if c.get("hata")]
              print(f"\n### {f}\n- çağrı: {d.get('kullanilan_cagri')}, hata: {len(h)}")
              for c in h[:6]:
                  print(f"- `{c['saglayici']}/{c['model']}` tur{c['tur']}: {c['hata'][:160]}")
          PY
