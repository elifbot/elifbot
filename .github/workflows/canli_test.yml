name: Canli Test (Binance/OKX)

on:
  workflow_dispatch:
    inputs:
      borsa:
        description: "binance | okx"
        default: "binance"
      sembol:
        description: "sembol sayisi"
        default: "20"
      dakika:
        description: "test suresi (dk)"
        default: "120"
      ileri:
        description: "ileri bar (analiz)"
        default: "30"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Borsa erisimi
        run: |
          mkdir -p runs
          {
            echo "tarih: $(date -u)"
            echo "binance: $(curl -s -o /dev/null -w '%{http_code}' https://fapi.binance.com/fapi/v1/ping || echo FAIL)"
            echo "okx: $(curl -s -o /dev/null -w '%{http_code}' https://www.okx.com/api/v5/public/time || echo FAIL)"
            echo "binance ornek: $(curl -s 'https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1m&limit=1' | head -c 300)"
            echo "okx ornek: $(curl -s 'https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=1m&limit=1' | head -c 300)"
            python3 -c "import urllib.request,json;print('py binance:', json.load(urllib.request.urlopen('https://fapi.binance.com/fapi/v1/ping', timeout=15)))" 2>&1
          } > runs/tani.txt 2>&1 || true
          cat runs/tani.txt
      - name: 30 dk canli test
        run: |
          python3 -m bot.canli.canli_test --borsa "${{ github.event.inputs.borsa }}" \
            --sembol "${{ github.event.inputs.sembol }}" --dakika "${{ github.event.inputs.dakika }}" \
            --analiz --ileri "${{ github.event.inputs.ileri }}" \
            --etiket "canli_$(date -u +%Y%m%d_%H%M%S)" 2>&1 | tee -a runs/tani.txt
      - name: Sonucu dala yaz
        if: always()
        run: |
          git config user.name "canli-test"
          git config user.email "canli@users.noreply.github.com"
          git checkout -b "canli/$(date -u +%Y%m%d-%H%M%S)"
          git add -A runs || true
          git commit -m "canli test sonucu" || echo "degisiklik yok"
          git push origin HEAD || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canli-test-sonuc
          path: runs/
