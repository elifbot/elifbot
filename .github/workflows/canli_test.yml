name: Canli Test (Binance/OKX)

on:
  workflow_dispatch:
    inputs:
      borsa:
        description: "binance | okx"
        default: "binance"
      sembol:
        description: "sembol sayisi"
        default: "20"
      dakika:
        description: "test suresi (dk)"
        default: "30"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Borsa erisimi
        run: |
          curl -s -o /dev/null -w "binance %{http_code}\n" https://fapi.binance.com/fapi/v1/ping || true
          curl -s -o /dev/null -w "okx     %{http_code}\n" https://www.okx.com/api/v5/public/time || true
      - name: 30 dk canli test
        run: |
          python3 -m bot.canli.canli_test --borsa "${{ github.event.inputs.borsa }}" \
            --sembol "${{ github.event.inputs.sembol }}" --dakika "${{ github.event.inputs.dakika }}" \
            --etiket "canli_$(date -u +%Y%m%d_%H%M%S)"
      - name: Sonucu dala yaz
        if: always()
        run: |
          git config user.name "canli-test"
          git config user.email "canli@users.noreply.github.com"
          git checkout -b "canli/$(date -u +%Y%m%d-%H%M%S)"
          git add -A runs || true
          git commit -m "canli test sonucu" || echo "degisiklik yok"
          git push origin HEAD || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canli-test-sonuc
          path: runs/
