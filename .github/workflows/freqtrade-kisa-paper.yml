name: Freqtrade OKX kısa paper doğrulama
on:
  workflow_call:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerçek Freqtrade sürümünü yükle
        run: python -m pip install 'freqtrade==2026.10'
      - name: Resmi örnek strateji ile anahtarsız 3 dakikalık dry-run
        run: python -u -m bot.bot_karsilastirma.freqtrade_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freqtrade-kisa-paper
          path: runs/freqtrade_smoke/
          if-no-files-found: warn
          retention-days: 7
