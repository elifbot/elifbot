name: TradingAgents model ve canlı aktarım tanısı
on:
  workflow_call:
permissions:
  contents: read
  checks: write
jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bağımlılıklar
        run: python -m pip install -r requirements-tradingagents.txt
      - name: Ollama başlat ve model indir
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama-diagnostic.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:0.5b
      - name: Model isteği ve GitHub aktarım izni tanısı
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time, urllib.request, urllib.error
          def emit(level, title, message):
              print(f'::{level} title={title}::{message}', flush=True)
          def test(label, fn):
              start = time.monotonic()
              try:
                  text = fn()
                  emit('notice', label, f'OK ({time.monotonic()-start:.1f}s): {str(text)[:180]}')
              except Exception as e:
                  emit('warning', label, f'{type(e).__name__} ({time.monotonic()-start:.1f}s): {str(e)[:140]}')
          def http_call():
              data = json.dumps({'model': 'qwen2.5:0.5b', 'messages': [{'role':'user','content':'Say OK.'}],
                                 'stream': False, 'options': {'num_predict': 8, 'num_ctx': 1024}}).encode()
              request = urllib.request.Request('http://127.0.0.1:11434/api/chat', data=data, headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=90) as r:
                  return json.load(r)['message']['content']
          def lc_call():
              from langchain_openai import ChatOpenAI
              llm = ChatOpenAI(model='qwen2.5:0.5b', api_key='ollama', base_url='http://127.0.0.1:11434/v1',
                               temperature=0, max_tokens=8, timeout=90, max_retries=0)
              return llm.invoke('Say OK.').content
          def checks_call():
              data = {'name':'TradingAgents canlı aktarım tanısı', 'head_sha':os.environ['TEST_SHA'],
                      'status':'completed', 'conclusion':'success',
                      'output':{'title':'Canlı aktarım izin kontrolü', 'summary':'GitHub Checks üzerinden panel veri aktarımı denendi.'}}
              req = urllib.request.Request('https://api.github.com/repos/elifbot/elifbot/check-runs',
                    data=json.dumps(data).encode(), method='POST', headers={
                      'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                      'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return 'check_id=' + str(json.load(r)['id'])
          test('Ollama HTTP', http_call)
          test('LangChain model', lc_call)
          test('GitHub Checks yazma', checks_call)
          PY
