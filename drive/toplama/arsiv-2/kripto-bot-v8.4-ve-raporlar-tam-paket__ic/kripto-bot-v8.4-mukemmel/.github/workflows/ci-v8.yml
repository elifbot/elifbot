name: Kripto Bot v8.0 CI (741 Test)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-v8:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml aiohttp pytest

      - name: Tüm Birleşik V8.0 Test Paketini Koştur (V7.8 + V4 + Çoklu-YZ)
        run: |
          pytest tests/ -q
