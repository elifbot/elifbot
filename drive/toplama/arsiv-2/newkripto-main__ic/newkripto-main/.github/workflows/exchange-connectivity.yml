name: exchange-connectivity

on:
  push:
    branches:
      - arena/9f6488eb-newkripto
      - main
    paths:
      - configs/connectivity-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    name: Resmî Futures erişimi — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    steps:
      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: WebSocket probe bağımlılığını kur
        run: python -m pip install websockets
      - name: Binance USD-M ve OKX katalog durumunu ölç
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          endpoints = {
              "binance_usdm": "https://fapi.binance.com/fapi/v1/exchangeInfo",
              "binance_usdm_api_host": "https://api.binance.com/fapi/v1/exchangeInfo",
              "binance_usdm_www_host": "https://www.binance.com/fapi/v1/exchangeInfo",
              "okx_swap": "https://www.okx.com/api/v5/public/instruments?instType=SWAP",
          }
          failed = {}
          results = {
              "runner_os": "${{ runner.os }}",
              "runner_arch": "${{ runner.arch }}",
              "runner_label": "${{ matrix.os }}",
              "endpoints": {},
          }
          for name, url in endpoints.items():
              request = urllib.request.Request(
                  url, headers={"User-Agent": "kripto-bot-connectivity-check/1.0"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.load(response)
                      if name.startswith("binance_"):
                          count = len(payload.get("symbols", []))
                      else:
                          count = len(payload.get("data", []))
                      print(f"{name}: HTTP {response.status}; katalog={count}")
                      results["endpoints"][name] = {"status": response.status, "catalog": count}
              except urllib.error.HTTPError as exc:
                  failed[name] = exc.code
                  print(f"{name}: HTTP {exc.code}")
                  results["endpoints"][name] = {"status": exc.code}
              except Exception as exc:
                  failed[name] = type(exc).__name__
                  print(f"{name}: {type(exc).__name__}: {exc}")
                  results["endpoints"][name] = {"error": type(exc).__name__}
          import asyncio
          import websockets

          ws_endpoints = {
              "binance_ws_public_book": (
                  "wss://fstream.binance.com/public/ws/btcusdt@bookTicker",
                  None,
              ),
              "binance_ws_market_trade": (
                  "wss://fstream.binance.com/market/ws/btcusdt@aggTrade",
                  None,
              ),
              "binance_ws_api_depth": (
                  "wss://ws-fapi.binance.com/ws-fapi/v1",
                  {
                      "id": "connectivity-probe",
                      "method": "depth",
                      "params": {"symbol": "BTCUSDT", "limit": 5},
                  },
              ),
          }

          async def probe_websockets():
              for name, (url, request_payload) in ws_endpoints.items():
                  try:
                      async with websockets.connect(
                          url,
                          open_timeout=15,
                          close_timeout=5,
                          ping_interval=None,
                          max_size=4 * 1024 * 1024,
                      ) as websocket:
                          if request_payload is not None:
                              await websocket.send(json.dumps(request_payload))
                          raw = await asyncio.wait_for(websocket.recv(), timeout=20)
                      payload = json.loads(raw)
                      status = int(payload.get("status", 200)) if isinstance(payload, dict) else 200
                      evidence = {
                          "status": status,
                          "message_type": type(payload).__name__,
                      }
                      if isinstance(payload, dict):
                          evidence["event"] = payload.get("e")
                          result = payload.get("result")
                          if isinstance(result, dict) and "bids" in result:
                              evidence["bids"] = len(result.get("bids") or [])
                              evidence["asks"] = len(result.get("asks") or [])
                      results["endpoints"][name] = evidence
                      print(f"{name}: WebSocket/HTTP {status}; kanıt={evidence}")
                      if status != 200:
                          failed[name] = status
                  except Exception as exc:
                      response = getattr(exc, "response", None)
                      status = getattr(response, "status_code", None)
                      evidence = {
                          "status": status,
                          "error": type(exc).__name__,
                          "detail": str(exc)[:240],
                      }
                      results["endpoints"][name] = evidence
                      failed[name] = status or type(exc).__name__
                      print(f"{name}: {evidence}")

          asyncio.run(probe_websockets())
          from pathlib import Path
          Path("connectivity-${{ matrix.os }}.json").write_text(
              json.dumps(results, indent=2), encoding="utf-8"
          )
          if failed:
              raise SystemExit(json.dumps(failed))
          PY
      - name: Sonucu artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connectivity-${{ matrix.os }}
          path: connectivity-${{ matrix.os }}.json
          if-no-files-found: error

  record:
    name: Erişim sonuçlarını kaydet
    if: always()
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kodu indir
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Probe artifactlarını indir
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ github.run_id }}
          path: results
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sonuçları birleştir ve dala kaydet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = {}
          for path in Path("results").rglob("connectivity-*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              rows[str(data.get("runner_label") or data.get("runner_os") or path.parent.name)] = data["endpoints"]
          if not rows:
              raise SystemExit("Probe sonucu bulunamadı")
          dest = Path("analysis/connectivity/latest.json")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(rows, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY
          git config user.name "arena-analysis"
          git config user.email "actions@users.noreply.github.com"
          git add analysis/connectivity/latest.json
          if git diff --cached --quiet; then
            echo "Sonuçlar zaten kayıtlı."
            exit 0
          fi
          git commit -m "chore: record futures connectivity matrix [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
