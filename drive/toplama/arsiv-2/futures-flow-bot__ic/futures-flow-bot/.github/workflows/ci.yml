name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint (ilk surumde uyari niteliginde)
        run: ruff check src tests
        continue-on-error: true
      - name: Birim testleri
        run: python -m unittest discover -s tests -v
      - name: Ayar dogrulama
        run: python -m tradebot -c config/config.example.yaml check-config
      - name: Cevrimdisi simulasyon (duman testi)
        run: python -m tradebot -c config/config.example.yaml simulate --minutes 80
