services:
  kripto-bot:
    build: .
    container_name: kripto-bot
    user: "appuser"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "8501:8501"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
