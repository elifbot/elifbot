develop_futures_paper_bot_source_code:
  description: |2

    Write the complete, fully-runnable Python 3.10+ source code for a PAPER-ONLY futures trading bot. Output EVERY file with FULL code — no placeholders, no "# TODO", no ellipsis. Every assumption, limitation, or unverified item must be documented inline with an "# ASSUMPTION:" or "# UNVERIFIED:" comment.

    ## ABSOLUTE SECURITY CONSTRAINTS (enforce in code, not just comments)
    - PAPER MODE ONLY. No real or testnet orders. No authenticated API calls anywhere.
    - No API key, secret, passphrase, or withdrawal permission referenced, prompted for, or stored.
    - If `--mode live` or `--mode testnet` is passed: print a clear error and exit with code 1.
    - No GitHub write, no deploy hooks, no email/message sending.
    - Do not claim to have read the reference ZIP at https://raw.githubusercontent.com/omeradar27562756-lang/botdeneme/main/KRIPTO-BOT-v7.8-DUZELTILMIS-2026-10-26.zip — you cannot access it. Mark any v7.8 compatibility claims as "UNVERIFIED: source not accessible".

    ## PROJECT STRUCTURE
    ```
    futures_bot/
    ├── main.py                     # Entry point, CLI, run loop, session timer
    ├── config.py                   # All tunable constants with inline documentation
    ├── data/
    │   ├── __init__.py
    │   ├── binance_futures_feed.py # Binance FAPI public: /fapi/v1/klines + /fapi/v1/exchangeInfo
    │   ├── okx_swap_feed.py        # OKX public: /api/v5/market/candles + /api/v5/public/instruments
    │   └── feed_utils.py           # Shared: candle validation, UTC sort, dedup, closed-candle filter
    ├── indicators/
    │   ├── __init__.py
    │   ├── core.py                 # EMA, SMA, RSI, MACD, Bollinger, ATR, ADX, Stoch-RSI, Supertrend
    │   ├── volume.py               # OBV, MFI, VWAP (session reset), CCI, Williams %R, Donchian, Keltner
    │   └── research.py             # Optional/experimental: TRIX, ROC, Ichimoku, CMF, Hurst — clearly marked EXPERIMENTAL, default disabled
    ├── strategy/
    │   ├── __init__.py
    │   └── signal_engine.py        # Regime detection (trend/range/squeeze), composite signal, contributor log
    ├── portfolio/
    │   ├── __init__.py
    │   └── paper_futures.py        # LONG/SHORT paper accounting, leverage, margin, fee, funding placeholder
    ├── logger/
    │   ├── __init__.py
    │   └── trade_logger.py         # CSV trade log (allowlisted fields only)
    ├── reports/
    │   ├── __init__.py
    │   └── pnl_report.py           # Realized/unrealized PnL, win rate, drawdown, Sharpe, position table
    ├── requirements.txt            # Runtime deps: requests, pandas, numpy, tabulate
    ├── requirements-dev.txt        # Dev/test deps: pytest, pytest-mock
    ├── setup.py
    └── README.md
    ```

    ## DATA LAYER REQUIREMENTS

    ### Binance FAPI (USDⓈ-M Futures, public endpoints, no auth):
    - Candles: `GET https://fapi.binance.com/fapi/v1/klines`
      - Params: symbol (e.g. BTCUSDT), interval, limit (max 1500)
      - Response: array of arrays; index 0=openTime, 1=open, 2=high, 3=low, 4=close, 5=volume, 6=closeTime, 8=numberOfTrades, 9=takerBuyBaseVol
      - Closed-candle filter: only use candles where closeTime < current_time_ms
    - Instrument info: `GET https://fapi.binance.com/fapi/v1/exchangeInfo`
      - Extract: tickSize, stepSize, contractType=PERPETUAL, marginAsset=USDT
      - Use to validate symbol is a valid USDⓈ-M perpetual before trading it

    ### OKX USDT Linear SWAP (public endpoints, no auth):
    - Candles: `GET https://www.okx.com/api/v5/market/candles`
      - Params: instId (e.g. BTC-USDT-SWAP), bar (e.g. 5m), limit (max 300)
      - Response: array where each item = [ts, o, h, l, c, vol_contracts, volCcy, volCcyQuote, confirm]
      - CRITICAL: `vol` field is in CONTRACTS not base units. `volCcyQuote` is USDT notional.
      - CRITICAL: Only use candles where `confirm == "1"` (closed candle). Discard confirm=="0".
      - Sort ascending by timestamp; deduplicate on timestamp.
    - Instruments: `GET https://www.okx.com/api/v5/public/instruments?instType=SWAP&settleCcy=USDT`
      - Extract: ctVal (contract value in base), ctMult, tickSz, lotSz, minSz for each instId
      - Use ctVal to convert contract volume to base units: base_qty = contracts * ctVal

    ### Feed utilities (feed_utils.py):
    - `validate_candle_row(row)`: check types, finite values, positive OHLC, non-negative volume, valid timestamp
    - `filter_closed_candles(df, current_time_ms)`: remove candles where close_time >= current_time_ms
    - `sort_and_dedup(df)`: sort by timestamp ascending, drop duplicate timestamps (keep last)
    - `check_candle_gaps(df, expected_interval_ms)`: detect and log missing candles; do NOT fill gaps with synthetic data
    - Handle HTTP errors explicitly: Timeout → RuntimeError, 429 → log rate-limit warning + backoff, 451 → log regional restriction + raise, non-2xx → raise with status code, malformed JSON → ValueError

    ## INDICATOR REQUIREMENTS (indicators/core.py)

    All functions: accept pd.DataFrame, return DataFrame with new columns added (copy, no mutation). Raise ValueError if required columns are missing or row count < minimum. Return NaN (not 0) for warmup rows. No look-ahead bias.

    ### EMA Ribbon
    - Periods: 5, 8, 10, 13, 21, 34, 50, 100, 200 (columns: ema_5, ema_8, ..., ema_200)
    - Also: EMA 9, 21, 50, 200 (same calculation, same columns if periods overlap)
    - Also: SMA 20, 50 (columns: sma_20, sma_50)
    - EMA formula: pandas ewm(span=N, adjust=False, min_periods=N) — document that adjust=False matches most charting platforms
    - EMA200 REQUIRES >= 200 valid (non-NaN) close rows. If fewer rows present: do NOT substitute 0; return NaN for ema_200. Set a column `data_sufficient_ema200` = True/False.
    - BUG FIX (explicitly document): Previous implementations substituted 0 for NaN EMA200, corrupting ribbon width and bullish/bearish flags. This implementation returns NaN and gates any ribbon signal on `data_sufficient_ema200`.

    ### Bollinger Bands
    - Period 20, std_dev 2.0
    - EXPLICIT: use pandas rolling(20).std(ddof=1) — sample standard deviation, matches TradingView default. Document this ddof choice.
    - Columns: bb_middle, bb_upper, bb_lower, bb_width, bb_position (% from lower to upper)

    ### RSI
    - Period 14, Wilder smoothing: ewm(alpha=1/14, adjust=False, min_periods=14)
    - RSI=100 when avg_loss==0 and avg_gain>0; RSI=0 when avg_gain==0 and avg_loss>0; RSI=50 when both==0 (flat price)
    - Column: rsi_14

    ### MACD
    - Fast 12, Slow 26, Signal 9; all ewm(adjust=False, min_periods=N)
    - Columns: macd, macd_signal, macd_histogram
    - Warmup: macd is NaN for first 25 rows; macd_signal is NaN for first 33 rows

    ### ATR (Average True Range)
    - Period 14, Wilder smoothing (ewm alpha=1/14, adjust=False, min_periods=14)
    - TR = max(high-low, |high-prev_close|, |low-prev_close|)
    - Column: atr_14

    ### ADX (Average Directional Index)
    - Period 14, Wilder smoothing on DM+ and DM-
    - Columns: adx_14, dmi_plus, dmi_minus
    - Warmup: NaN for first 27 rows

    ### Stochastic RSI
    - Params: rsi_period=14, stoch_period=14, smooth_k=3, smooth_d=3
    - stoch_rsi = (rsi - min(rsi, stoch_period)) / (max(rsi, stoch_period) - min(rsi, stoch_period))
    - K = SMA(stoch_rsi, smooth_k); D = SMA(K, smooth_d)
    - Columns: stoch_rsi_k, stoch_rsi_d

    ### Supertrend
    - Period 10, multiplier 3.0
    - Based on ATR; direction flips when close crosses band
    - Columns: supertrend, supertrend_direction (1=bullish, -1=bearish)
    - Document that flip logic requires iterating rows (cannot be fully vectorised without look-ahead risk); use explicit loop

    ## INDICATOR REQUIREMENTS (indicators/volume.py)

    ### OBV (On-Balance Volume)
    - Standard cumulative sum; column: obv

    ### MFI (Money Flow Index)
    - Period 14; uses typical_price = (H+L+C)/3 and volume
    - Column: mfi_14

    ### VWAP (Session VWAP)
    - Reset at UTC midnight (or at first candle of each UTC date)
    - cumsum(typical_price * volume) / cumsum(volume), within each UTC day group
    - Column: vwap

    ### CCI (Commodity Channel Index)
    - Period 20; CCI = (typical_price - sma_tp) / (0.015 * mean_deviation)
    - Column: cci_20

    ### Williams %R
    - Period 14; %R = (highest_high - close) / (highest_high - lowest_low) * -100
    - Column: willr_14

    ### Donchian Channel
    - Period 20; upper = max(high, 20), lower = min(low, 20), mid = (upper+lower)/2
    - Columns: don_upper, don_lower, don_mid

    ### Keltner Channel
    - Period 20 EMA ± 2 * ATR_10
    - Columns: kelt_upper, kelt_lower, kelt_mid

    ### Bollinger-Keltner Squeeze
    - squeeze = True when BB is inside Keltner (bb_upper < kelt_upper and bb_lower > kelt_lower)
    - Column: bb_kelt_squeeze (bool)

    ## RESEARCH INDICATORS (indicators/research.py)
    Mark every function with `# EXPERIMENTAL — not used in default signal, default disabled`.
    Include stubs (raise NotImplementedError with explanation) for: WMA, HMA, KAMA, DEMA, TEMA, T3, TRIX, ROC, Ichimoku, Parabolic SAR, Alligator, Chandelier, CMF, AD, Choppiness, Hurst exponent approximation, divergence detector, BTC correlation. Do NOT produce fake values for these.

    ## SIGNAL ENGINE (strategy/signal_engine.py)

    ### Regime Detection
    - TREND: ADX > 25 AND (EMA ribbon aligned bullish or bearish)
    - RANGE: ADX <= 20 AND bb_kelt_squeeze == False
    - SQUEEZE: bb_kelt_squeeze == True
    - Document: regime gates which indicators vote

    ### Signal Generation
    - LONG signal (all must be true): TREND regime; ema ribbon bullish (all 9 EMAs ascending); RSI 45-70; MACD histogram > 0; price > supertrend; bb_position > 0.5; price above VWAP
    - SHORT signal (all must be true): TREND regime; ema ribbon bearish (all 9 EMAs descending); RSI 30-55; MACD histogram < 0; price < supertrend; bb_position < 0.5; price below VWAP
    - HOLD: any condition fails, regime is RANGE/SQUEEZE, or any required indicator is NaN
    - Output: Signal enum (LONG/SHORT/HOLD), contributor_log dict listing each indicator's vote and value, regime label
    - GATE: if `data_sufficient_ema200 == False`, always return HOLD regardless of other indicators
    - No look-ahead: only use iloc[-1] of closed candles

    ## PAPER FUTURES ACCOUNTING (portfolio/paper_futures.py)

    ### Configuration
    - Starting balance: 1,000 USDT (configurable)
    - Default virtual leverage: 10x (configurable, max 20x enforced in code)
    - Margin per trade: 5% of balance = 50 USDT initial (configurable)
    - Max open positions: 6 total, 4 in same direction
    - Cross-margin utilisation cap: 45% of balance
    - Minimum free balance floor: 100 USDT
    - Fee tiers (SIMULATION ASSUMPTION — not real account rates): maker 0.02%, taker 0.05%

    ### Position Open (open_position)
    - Check: free_balance >= margin_required AND total_open <= 6 AND same_direction_count <= 4 AND utilisation < 45%
    - Reject and log reason if any check fails
    - On fill: deduct margin from free_balance; record entry_price, side, qty_base, qty_contracts, leverage, entry_fee (taker), timestamp
    - PnL formula: LONG: unrealized = (current_price - entry_price) * qty_base; SHORT: unrealized = (entry_price - current_price) * qty_base
    - Do NOT multiply by leverage again — leverage is already in qty_base calculation

    ### Position Close (close_position)
    - Compute gross PnL, deduct exit_fee (taker by default), return margin to free_balance
    - Realized PnL = gross_pnl - entry_fee - exit_fee
    - Record: entry/exit price, side, qty_base, qty_contracts, leverage, both fees, realized_pnl, reason, duration

    ### Example verification (produce this exact calculation as a test in the code):
    - 5 base units LONG, entry 100, exit 101, both sides taker 0.05%:
      - gross_pnl = (101-100) * 5 = +5.0 USDT
      - entry_fee = 100 * 5 * 0.0005 = 0.25 USDT
      - exit_fee = 101 * 5 * 0.0005 = 0.2525 USDT
      - net_pnl = 5.0 - 0.25 - 0.2525 = +4.4975 USDT ✓
    - 5 base units SHORT, entry 100, exit 99, both taker 0.05%:
      - gross_pnl = (100-99) * 5 = +5.0 USDT
      - entry_fee = 100 * 5 * 0.0005 = 0.25 USDT
      - exit_fee = 99 * 5 * 0.0005 = 0.2475 USDT
      - net_pnl = 5.0 - 0.25 - 0.2475 = +4.5025 USDT ✓

    ### Stop-loss, Take-profit, Daily loss limit
    - Stop-loss: configurable % from entry, default 2% — enforced on every price update before new signals
    - Trailing stop / profit protection: optional, configurable
    - Daily loss limit: if realized PnL for current UTC day < -threshold (default -5% of starting balance), block new positions for rest of day
    - Ambiguity on same-candle SL+TP: document assumption ("assume stop triggered first at stop price; conservative fill")

    ### Funding
    - Include funding_fee field in position records, default 0.0
    - Document: "Funding rate data not fetched from exchange; funding_fee set to 0.0. Mark as UNVERIFIED/PLACEHOLDER."

    ### Lot/tick rounding
    - Accept tickSize and stepSize from exchangeInfo/instruments
    - Round price to tickSize, round qty to stepSize using math.floor (conservative)
    - If rounding makes qty == 0, reject trade

    ### Session timer (main.py integration)
    - Optional 60-minute paper session: `--session-minutes 60`
    - No new positions in last 7 minutes of session
    - At session end: close all open paper positions at last known price, log "SESSION_CLOSE" reason
    - Do NOT start a new session automatically; require explicit re-run

    ## TRADE LOGGER (logger/trade_logger.py)
    CSV with allowlisted fields only: timestamp, symbol, exchange, side, entry_price, exit_price, qty_base, qty_contracts, leverage, margin_used, entry_fee, exit_fee, funding_fee, realized_pnl, reason, duration_seconds. No credentials, no HTTP headers, no internal paths.

    ## PNL REPORT (reports/pnl_report.py)
    Print to console: starting balance, current equity (cash + unrealized), realized PnL, total return %, win rate, losing trades, max drawdown, Sharpe ratio (annualised), position table. Equity CSV for charting.

    ## REQUIREMENTS FILES
    ```
    # requirements.txt (runtime)
    requests>=2.32.4,<3
    pandas>=2.2.3,<3
    numpy>=2.0.0,<3
    tabulate>=0.9.0,<1

    # requirements-dev.txt (testing only)
    pytest>=8.0.0,<9
    pytest-mock>=3.14.0,<4
    ```

    ## README.md
    Must include: paper-mode disclaimer, public endpoints used, no-API-key statement, install steps, usage examples with --source, --symbol, --leverage, --margin-pct, --session-minutes flags, configuration reference, known limitations and unverified items list.

    Output each file as: `# === FILE: futures_bot/path/to/file ===`
  expected_output: |2

    Complete Python source code for all files in the project structure. Every file contains full runnable code. All assumptions documented with # ASSUMPTION: or # UNVERIFIED: comments. PnL example calculations verified inline. EMA200 NaN-guard bug fix documented. Includes requirements.txt, requirements-dev.txt, setup.py, README.md. Every file labeled with # === FILE: futures_bot/path/to/file ===.
  agent: senior_python_futures_bot_developer
