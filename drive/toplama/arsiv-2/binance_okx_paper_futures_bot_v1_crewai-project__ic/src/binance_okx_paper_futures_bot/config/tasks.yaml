security_audit_and_final_deliverable:
  description: |2

    You have received the complete futures bot source code and test suite from context. Perform a verifiable security audit across 10 categories, then assemble the final deliverable.

    ## PART 1 — SECURITY AUDIT

    For EACH category below, you MUST state:
    1. **Verification method**: how you checked it (e.g., "LLM code review — searched for POST/PUT/DELETE strings", "LLM code review — checked all URL constants", etc.)
    2. **Result**: ✅ PASS or ⚠️ ISSUE FOUND
    3. If ISSUE: the corrected code inline

    **DO NOT state a category is clean without specifying the verification method. If no automated scanner was available, state: "Checked by LLM code review only — not verified by automated scanner."**

    ### Audit Categories:

    **1. Real Order Prevention**
    Verification: Search all source files for POST, PUT, DELETE HTTP method calls and any exchange trading/account endpoint patterns (/order, /trade, /withdraw, /account). Confirm only GET requests exist. Confirm `requests.Session.get()` is the only HTTP method used.

    **2. Credential Leakage**
    Verification: Search all source files for: api_key, secret, passphrase, password, token, Authorization header, bearer, private_key, withdraw. Confirm none present. Confirm no os.environ reads for credential variables. Confirm no .env file loading.

    **3. Network Surface**
    Verification: List every hardcoded URL and URL-building pattern in the codebase. Confirm all resolve to:
    - `https://fapi.binance.com/fapi/v1/klines` (GET only)
    - `https://fapi.binance.com/fapi/v1/exchangeInfo` (GET only)
    - `https://www.okx.com/api/v5/market/candles` (GET only)
    - `https://www.okx.com/api/v5/public/instruments` (GET only)
    Flag any other URL or any URL constructed from user input without validation.

    **4. Live-Mode Guard**
    Verification: Confirm that passing `--mode live` or `--mode testnet` causes the program to exit with an error message and non-zero exit code, not silently proceed. Check that no fallback enables authenticated calls.

    **5. Risk Management Completeness**
    Verification: Check that:
    - Stop-loss is enforced BEFORE processing new signals on every cycle
    - Commission deducted from BOTH open and close sides
    - Free balance floor (100 USDT) is enforced and balance cannot go negative
    - Daily loss limit blocks new positions when triggered
    - Leverage cap (max 20x) is enforced at position open
    - Position limits (max 6 total, 4 same direction, 45% utilisation) are checked

    **6. Error Handling**
    Verification: Check that HTTP Timeout, 429, 451, non-2xx, malformed JSON, and empty dataset cases are all handled with explicit exceptions (not silent). Verify no bare `except:` clauses that swallow errors. Verify main loop logs cycle failures.

    **7. Input Validation**
    Verification: Check that:
    - OKX confirm field is checked before using a candle
    - Candle OHLC values validated as finite, positive numbers
    - Timestamps validated as integers/convertible
    - exchangeInfo/instruments response validated before extracting tick/lot sizes
    - DataFrame column presence checked before indicator calculation

    **8. Log / CSV Safety**
    Verification: Check the TradeLogger fieldnames allowlist. Confirm no HTTP headers, response bodies, credential variables, or absolute internal paths are written to CSV or console logs.

